<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITRE</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    #selectionArea {
        width: 10%;
        height: 100vh;
        border: 1px solid black;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 10px;
    }

    #drawingArea {
        width: 90%;
        height: 100vh;
        border: 1px solid black;
        position: relative;
    }

    .shape {
        position: absolute;
        border: 0px solid black;
    }

    #selectionArea .shape {
        position: relative;
        width: 100%;
        height: auto;
        aspect-ratio: 2/1;
        cursor: pointer;
    }

    #selectionArea .shape:hover {
        background-color: #f0f0f0;
    }

    #previewCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
    }
</style>
<body>
    <div id="selectionArea">
        <canvas id="circle0" class="shape">
        Your browser does not support the HTML canvas tag.</canvas>
        <canvas id="rectangle0" class="shape">
        Your browser does not support the HTML canvas tag.</canvas>
        <canvas id="triangle0" class="shape">
        Your browser does not support the HTML canvas tag.</canvas>
        <input type="color" value="#000000" autocomplete="off">
        <button id="ChangeMode" onclick="changeMode()">Changer de Mode</button>
        <label>mode actuel : <label id="showMode">draw</label></label>
    </div>
    <div id="drawingArea">
        <canvas id="previewCanvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
